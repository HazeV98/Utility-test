<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vademecum - Utility</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS (Per la Mappa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Librerie esterne -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { 
            --primary: #0066cc; 
            --surface: #ffffff;
            --surface-hover: #f8f9fa;
            --text-main: #1a1a1a; 
            --text-muted: #5f6368;
            --border-color: #e0e0e0;
            --bg-color: #f0f2f5;
            --danger: #d93025;
            --success: #0f9d58;
            --warning: #ffb74d;
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05);
            --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-color);
            margin: 0; padding: 0; overflow: hidden; color: var(--text-main);
        }

        /* --- HEADER DINAMICO --- */
        .vd-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 65px; 
            padding: env(safe-area-inset-top) 20px 0 20px; background: var(--surface);
            box-shadow: var(--shadow-sm); z-index: 100; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between;
        }

        .vd-header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .vd-header-center { flex: 1; transition: var(--transition); padding: 0 10px; overflow: hidden; }
        .vd-header-center.text-center { text-align: center; }
        .vd-header-center.text-left { text-align: left; }
        .vd-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; justify-content: flex-end; }

        .vd-title { font-size: 19px; font-weight: 800; margin: 0; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.5px; }
        
        .icon-btn {
            background: var(--surface-hover); border: 1px solid var(--border-color); font-size: 18px;
            color: var(--primary); cursor: pointer; width: 38px; height: 38px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); box-shadow: var(--shadow-sm);
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.btn-transparent { background: transparent; border: none; box-shadow: none; font-size: 20px; width: auto; height: auto; }

        /* --- CONTENITORE SLIDE (DRILL-DOWN) --- */
        .vd-viewport {
            position: relative; width: 100%; height: 100vh;
            padding-top: calc(65px + env(safe-area-inset-top));
            overflow-x: hidden; box-sizing: border-box;
        }

        .vd-panel {
            position: absolute; top: calc(65px + env(safe-area-inset-top)); left: 0;
            width: 100%; height: calc(100vh - 65px - env(safe-area-inset-top));
            padding: 20px; box-sizing: border-box; overflow-y: auto;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .panel-center { transform: translateX(0); }
        .panel-left { transform: translateX(-100%); }
        .panel-right { transform: translateX(100%); }

        /* --- ELEMENTI LISTA E MODALI --- */
        .vd-list-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface); padding: 18px 20px; border-radius: 14px; margin-bottom: 12px;
            box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--border-color);
        }
        .vd-list-item:active { background: var(--surface-hover); transform: scale(0.98); }
        .item-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 14px; }
        .edit-controls { display: none; gap: 10px; align-items: center; }
        .edit-mode .edit-controls { display: flex; }
        .edit-mode .vd-list-item { cursor: grab; }
        .drag-handle { color: var(--text-muted); cursor: grab; font-size: 18px; padding-right: 10px; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content { background: var(--surface); padding: 28px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .input-field { width: 100%; padding: 14px; margin-bottom: 16px; border: 2px solid var(--border-color); border-radius: 12px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
        .btn-action { width: 100%; padding: 14px; background: var(--success); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-action:active { transform: scale(0.96); }
        
        /* Stili Editor Scheda */
        .scheda-content-box h3 { color: var(--primary); margin-top: 15px; margin-bottom: 10px; }
        .scheda-content-box ul { padding-left: 20px; margin-bottom: 15px; }
        .scheda-content-box li { margin-bottom: 5px; }
        .scheda-content-box:focus { outline: none; }
    </style>
</head>
<body>

    <header class="vd-header">
        <div class="vd-header-left">
            <button class="icon-btn btn-transparent" onclick="window.location.href='index.html'" title="Torna alla Home">
                <i class="fa-solid fa-house"></i>
            </button>
            <button id="btn-back" class="icon-btn btn-transparent" style="display: none;" onclick="window.Vademecum.goBack()">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        <div class="vd-header-center text-center" id="header-title-container">
            <h2 id="vd-main-title" class="vd-title">Vademecum</h2>
        </div>
        <div class="vd-header-right">
            <!-- Tasto Chiave: Visibile solo in Edit Mode -->
            <button id="btn-token-admin" class="icon-btn" style="display:none; color: var(--warning); border-color: var(--warning);" onclick="window.apriModal('tokenModal')" title="Imposta Token">
                <i class="fa-solid fa-key"></i>
            </button>
            <!-- Tasto Matita/Check -->
            <button id="btn-edit-mode" class="icon-btn" style="display:none;" onclick="window.Vademecum.toggleEditMode()" title="Modifica">
                <i id="edit-icon" class="fa-solid fa-pen"></i>
            </button>
        </div>
    </header>

    <main class="vd-viewport" id="viewport"></main>

    <!-- Pulsante Aggiungi (Visibile solo in Edit Mode) -->
    <div id="add-fab" style="display: none; position: fixed; bottom: 30px; right: 30px; z-index: 90;">
        <button class="icon-btn" style="background: var(--primary); color: white; border-radius: 50%; width: 60px; height: 60px; box-shadow: 0 4px 12px rgba(0,102,204,0.4); font-size: 24px;" onclick="window.Vademecum.openAddModal()">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- Modale Token -->
    <div id="tokenModal" class="modal-overlay" onclick="window.chiudiSuSfondo(event, 'tokenModal')">
        <div class="modal-content">
            <i class="fa-solid fa-xmark" style="position: absolute; right: 20px; top: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer;" onclick="window.chiudiModal('tokenModal')"></i>
            <h3 style="margin-top:0; color: var(--danger);"><i class="fa-solid fa-key"></i> Token GitHub</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Inserisci il Personal Access Token per abilitare il caricamento di planimetrie e foto.</p>
            
            <input type="password" id="adminPatToken" class="input-field" placeholder="ghp_...">
            
            <button class="btn-action" onclick="window.Vademecum.salvaToken()">Salva Token</button>
        </div>
    </div>

    <script type="module">
        import { avviaMotoreVademecum } from './moduli/vademecum.js';
        window.apriModal = (id) => document.getElementById(id).style.display = 'flex';
        window.chiudiModal = (id) => document.getElementById(id).style.display = 'none';
        window.chiudiSuSfondo = (e, id) => { if (e.target.id === id) window.chiudiModal(id); };
        avviaMotoreVademecum();
    </script>
</body>
</html>
